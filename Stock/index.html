<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock Inward Portal</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--bd:#d9dde3;--pr:#1d4ed8;--er:#b91c1c;--wn:#b45309;--ok:#15803d}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--card:#1a1f26;--tx:#e8eaed;--mu:#9aa3af;--bd:#333b46;--pr:#6ea0ff;--er:#f87171;--wn:#fbbf24;--ok:#4ade80}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{padding:14px 16px;background:var(--card);border-bottom:1px solid var(--bd);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
h1{font-size:18px;margin:0 auto 0 0}main{padding:12px;max-width:1300px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
button,.btn{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer}
button.sec{background:transparent;color:var(--pr);border:1px solid var(--pr)}button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.split{display:grid;gap:12px;grid-template-columns:1fr}@media(min-width:900px){.split.has{grid-template-columns:340px 1fr}}
img#prev{max-width:100%;border-radius:8px;border:1px solid var(--bd)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:760px}
th,td{border:1px solid var(--bd);padding:4px;text-align:left;font-size:13px}th{background:var(--bg)}
td input{width:100%;border:0;background:transparent;color:var(--tx);padding:5px;font:inherit}
td input.bad{outline:2px solid var(--er)}td input.warn{outline:2px solid var(--wn)}
.msg{margin:6px 0;font-size:13px}.err{color:var(--er)}.wn{color:var(--wn)}.ok{color:var(--ok)}.mu{color:var(--mu)}
.hide{display:none}progress{width:100%}
</style></head><body>
<header><h1>Stock Inward Portal</h1>
<button class="sec" data-v="scan">Scan</button><button class="sec" data-v="stock">Stock</button><button class="sec" data-v="hist">Transactions</button></header>
<main>
<section id="scan">
 <div class="card"><div class="row">
  <label class="btn">📷 Take photo<input id="cam" type="file" accept="image/*" capture="environment" hidden></label>
  <label class="btn">⬆ Upload invoice image<input id="up" type="file" accept="image/*" hidden></label>
  <input id="invno" placeholder="Invoice no." style="padding:8px"><input id="invdt" type="date" style="padding:8px">
  <input id="invtot" type="number" step="0.01" placeholder="Invoice total" style="padding:8px">
 </div><div class="msg mu">Image files only (JPG/PNG). For PDFs, screenshot the page first.</div>
 <progress id="pg" class="hide" max="1" value="0"></progress><div id="ocrmsg" class="msg"></div></div>
 <div class="split" id="sp"><div class="card hide" id="imgc"><img id="prev" alt="Invoice"></div>
 <div class="card"><div class="tw"><table id="tbl"><thead><tr><th>S.No.</th><th>Part Number</th><th>Description of Goods</th><th>HSN Code</th><th>Quantity</th><th>Unit</th><th>Rate</th><th>Amount</th><th></th></tr></thead><tbody></tbody></table></div>
 <div class="row" style="margin-top:8px"><button class="sec" id="add">+ Add row</button><button id="rev">Review Items →</button></div>
 <div id="issues" class="msg"></div></div></div>
</section>
<section id="review" class="hide"><div class="card"><h2 style="margin-top:0">Review Items</h2>
 <div id="rsum" class="msg"></div><div class="tw"><table id="rt"></table></div>
 <div class="row" style="margin-top:10px"><button class="sec" id="back">← Back to edit</button><button id="conf">Confirm &amp; Update Stock</button></div>
 <div class="msg mu">Stock is not changed until you press Confirm &amp; Update Stock.</div></div></section>
<section id="done" class="hide"><div class="card" id="donec"></div></section>
<section id="stock" class="hide"><div class="card"><div class="tw"><table id="st"></table></div></div></section>
<section id="hist" class="hide"><div class="card" id="ht"></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const sv=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let rows=[],imgData='',meta={};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=s=>{const n=parseFloat(String(s).replace(/,/g,''));return isNaN(n)?NaN:n};
const amt=r=>{const q=num(r.qty),t=num(r.rate);return isNaN(q)||isNaN(t)?'':+(q*t).toFixed(2)};

function show(v){['scan','review','done','stock','hist'].forEach(x=>$('#'+x).classList.toggle('hide',x!==v));
 if(v==='stock')renderStock();if(v==='hist')renderHist()}
document.querySelectorAll('header [data-v]').forEach(b=>b.onclick=()=>show(b.dataset.v));

// ---- OCR + parsing ----
function parseInvoice(text){
 const out=[],lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
 const re=/^(\d{1,3})?[\s.)]*(.+?)\s+(\d{4,8})\s+([\d.,]+)\s*([A-Za-z]{2,5})\.?\s+([\d.,]+)/;
 for(const l of lines){const m=l.match(re);if(!m)continue;
  const d=m[2],i=d.indexOf('-');
  out.push({part:i>0?d.slice(0,i).trim():'',desc:i>0?d.slice(i+1).trim():d.trim(),hsn:m[3],qty:m[4],unit:m[5].toUpperCase(),rate:m[6],flag:{part:i<=0}})}
 const tm=text.match(/total[^\d\n]{0,20}([\d,]+\.\d{2})/i);
 return{items:out,total:tm?tm[1]:''}}
async function doOcr(file){
 if(!file)return;
 const rd=new FileReader();rd.onload=()=>{imgData=rd.result;$('#prev').src=imgData;$('#imgc').classList.remove('hide');$('#sp').classList.add('has')};rd.readAsDataURL(file);
 $('#pg').classList.remove('hide');$('#ocrmsg').className='msg';$('#ocrmsg').textContent='Reading invoice…';
 try{const r=await Tesseract.recognize(file,'eng',{logger:m=>{if(m.progress)$('#pg').value=m.progress}});
  const p=parseInvoice(r.data.text);
  rows=p.items;if(p.total&&!$('#invtot').value)$('#invtot').value=num(p.total);
  if(!rows.length){rows=[blank()];$('#ocrmsg').className='msg wn';$('#ocrmsg').textContent='No item lines could be read reliably. Please enter items manually using the invoice image.'}
  else{$('#ocrmsg').className='msg ok';$('#ocrmsg').textContent=rows.length+' item(s) found. Fields outlined in orange could not be read reliably — please check them.'}
 }catch(e){rows=[blank()];$('#ocrmsg').className='msg err';$('#ocrmsg').textContent='OCR failed ('+e.message+'). Enter items manually.'}
 $('#pg').classList.add('hide');renderTable()}
$('#cam').onchange=e=>doOcr(e.target.files[0]);$('#up').onchange=e=>doOcr(e.target.files[0]);
const blank=()=>({part:'',desc:'',hsn:'',qty:'',unit:'',rate:'',flag:{}});

// ---- editable table ----
function cell(i,k,type){const r=rows[i];const v=r[k]??'';
 let c='';if(v===''||(r.flag&&r.flag[k]))c='warn';
 if((k==='qty'&&v!==''&&!(num(v)>0))||(k==='rate'&&v!==''&&!(num(v)>=0)))c='bad';
 return`<td><input data-i="${i}" data-k="${k}" class="${c}" value="${esc(v)}" ${type==='n'?'inputmode="decimal"':''}></td>`}
function renderTable(){
 $('#tbl tbody').innerHTML=rows.map((r,i)=>`<tr><td>${i+1}</td>${cell(i,'part')}${cell(i,'desc')}${cell(i,'hsn')}${cell(i,'qty','n')}${cell(i,'unit')}${cell(i,'rate','n')}<td id="a${i}">${amt(r)}</td><td><button class="sec" data-del="${i}">✕</button></td></tr>`).join('');
 showIssues()}
$('#tbl').addEventListener('input',e=>{const t=e.target;if(!t.dataset.k)return;const i=+t.dataset.i;
 rows[i][t.dataset.k]=t.value;if(rows[i].flag)delete rows[i].flag[t.dataset.k];
 $('#a'+i).textContent=amt(rows[i]);showIssues()});
$('#tbl').addEventListener('change',e=>{if(e.target.dataset.k)renderTable()});
$('#tbl').addEventListener('click',e=>{const d=e.target.dataset.del;if(d!==undefined){rows.splice(+d,1);renderTable()}});
$('#add').onclick=()=>{rows.push(blank());renderTable()};

function validate(){
 const iss=[];
 if(!rows.length)iss.push(['err','No items to save.']);
 rows.forEach((r,i)=>{const n=i+1;
  if(!r.part)iss.push(['wn',`Row ${n}: Part Number missing`]);
  if(!r.desc)iss.push(['wn',`Row ${n}: Description missing`]);
  if(!r.hsn)iss.push(['wn',`Row ${n}: HSN Code missing`]);
  if(!r.unit)iss.push(['wn',`Row ${n}: Unit missing`]);
  if(!(num(r.qty)>0))iss.push(['err',`Row ${n}: Quantity must be a number greater than 0`]);
  if(!(num(r.rate)>=0))iss.push(['err',`Row ${n}: Rate must be a valid number`])});
 const tot=num($('#invtot').value);
 const sum=rows.reduce((s,r)=>s+(+amt(r)||0),0);
 if(!isNaN(tot)&&rows.length&&Math.abs(tot-sum)>1)iss.push(['wn',`Items total ${sum.toFixed(2)} differs from invoice total ${tot.toFixed(2)} (difference may be GST/freight/round-off — check)`]);
 return{iss,sum}}
function showIssues(){const{iss,sum}=validate();
 $('#issues').innerHTML=iss.map(([c,m])=>`<div class="${c==='err'?'err':'wn'}">• ${esc(m)}</div>`).join('')+`<div class="mu">Items total: ${sum.toFixed(2)}</div>`}

// ---- review & confirm ----
function rtable(list){return'<thead><tr><th>S.No.</th><th>Part Number</th><th>Description</th><th>HSN</th><th>Qty</th><th>Unit</th><th>Rate</th><th>Amount</th></tr></thead><tbody>'+list.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.part)}</td><td>${esc(r.desc)}</td><td>${esc(r.hsn)}</td><td>${esc(r.qty)}</td><td>${esc(r.unit)}</td><td>${esc(r.rate)}</td><td>${amt(r)}</td></tr>`).join('')+'</tbody>'}
$('#rev').onclick=()=>{const{iss,sum}=validate();const errs=iss.filter(x=>x[0]==='err');
 $('#rt').innerHTML=rtable(rows);
 $('#rsum').innerHTML=iss.map(([c,m])=>`<div class="${c==='err'?'err':'wn'}">• ${esc(m)}</div>`).join('')+`<div>Total: <b>${sum.toFixed(2)}</b></div>`;
 $('#conf').disabled=errs.length>0;show('review')};
$('#back').onclick=()=>show('scan');
$('#conf').onclick=()=>{
 const txns=ld('inward_txns',[]);const stock=ld('stock',{});
 const no='INW-'+new Date().getFullYear()+'-'+String(txns.length+1).padStart(4,'0');
 const final=rows.map(r=>({part:r.part.trim(),desc:r.desc.trim(),hsn:r.hsn.trim(),qty:num(r.qty),unit:r.unit.trim(),rate:num(r.rate),amount:+amt(r)}));
 txns.push({no,invoiceNo:$('#invno').value,invoiceDate:$('#invdt').value,invoiceTotal:$('#invtot').value,
  invoiceImage:imgData,user:'portal user',confirmedAt:new Date().toISOString(),
  extracted:ld('_extracted',[]),items:final});
 final.forEach(f=>{const s=stock[f.part]||{qty:0};
  stock[f.part]={part:f.part,desc:f.desc,hsn:f.hsn,unit:f.unit,rate:f.rate,qty:+(s.qty+f.qty).toFixed(3)}});
 try{sv('inward_txns',txns);sv('stock',stock)}catch(e){txns[txns.length-1].invoiceImage='';sv('inward_txns',txns);sv('stock',stock)}
 $('#donec').innerHTML=`<h2 style="margin-top:0" class="ok">Stock updated</h2><p>Transaction number: <b>${no}</b></p><div class="tw"><table>${rtable(final)}</table></div><p><button id="nw">Scan another invoice</button></p>`;
 $('#nw').onclick=()=>{rows=[];imgData='';['invno','invdt','invtot'].forEach(x=>$('#'+x).value='');$('#imgc').classList.add('hide');$('#sp').classList.remove('has');$('#ocrmsg').textContent='';renderTable();show('scan')};
 show('done')};
// keep original OCR values for the audit trail
const _o=doOcr;doOcr=async f=>{await _o(f);sv('_extracted',rows.map(r=>({part:r.part,desc:r.desc,hsn:r.hsn,qty:r.qty,unit:r.unit,rate:r.rate})))};
$('#cam').onchange=e=>doOcr(e.target.files[0]);$('#up').onchange=e=>doOcr(e.target.files[0]);

function renderStock(){const s=Object.values(ld('stock',{}));
 $('#st').innerHTML='<thead><tr><th>Part Number</th><th>Description</th><th>HSN</th><th>Qty</th><th>Unit</th><th>Last rate</th></tr></thead><tbody>'+(s.map(r=>`<tr><td>${esc(r.part)}</td><td>${esc(r.desc)}</td><td>${esc(r.hsn)}</td><td>${r.qty}</td><td>${esc(r.unit)}</td><td>${r.rate}</td></tr>`).join('')||'<tr><td colspan=6>No stock yet.</td></tr>')+'</tbody>'}
function renderHist(){const t=ld('inward_txns',[]).slice().reverse();
 $('#ht').innerHTML=t.map(x=>`<p><b>${x.no}</b> · Invoice ${esc(x.invoiceNo)||'—'} ${esc(x.invoiceDate)} · ${x.items.length} items · ${new Date(x.confirmedAt).toLocaleString()}</p>`).join('')||'No transactions yet.'}

// ---- AI auto-fill (falls back to on-device OCR) ----
function shrink(file,max=1800){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.9))};im.onerror=rej;im.src=URL.createObjectURL(file)})}
async function autoFill(file){
 if(!file)return;
 imgData=await shrink(file);$('#prev').src=imgData;$('#imgc').classList.remove('hide');$('#sp').classList.add('has');
 const m=$('#ocrmsg');m.className='msg';m.textContent='Reading invoice and filling items…';
 try{
  const d=await api('/api/extract',{method:'POST',body:JSON.stringify({image:imgData.split(',')[1],media_type:'image/jpeg'})});
  if($('#invno'))$('#invno').value=d.invoice_no||'';
  if(d.invoice_date)$('#invdt').value=d.invoice_date;
  if(d.total!=null)$('#invtot').value=d.total;
  rows=(d.items||[]).map(i=>({part:i.part||'',desc:i.desc||'',hsn:String(i.hsn||''),qty:i.qty??'',unit:(i.unit||'').toUpperCase(),rate:i.rate??'',flag:{}}));
  if(!rows.length)throw new Error('No items found');
  sv('_extracted',rows.map(r=>({...r,flag:undefined})));
  m.className='msg ok';m.textContent=rows.length+' item(s) filled from the invoice. Please check them against the image, then press Review Items.';
  renderTable();
 }catch(e){
  m.className='msg wn';m.textContent='Auto-fill unavailable ('+e.message+'). Using basic on-device reading instead…';
  await doOcr(file);
 }}
$('#cam').onchange=e=>autoFill(e.target.files[0]);$('#up').onchange=e=>autoFill(e.target.files[0]);

// ---- central database (Cloudflare D1) ----
async function api(path,opt={}){
 const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json','x-pin':localStorage.getItem('pin')||''}});
 if(r.status===401){const p=prompt('Enter portal PIN');if(p){localStorage.setItem('pin',p);return api(path,opt)}}
 const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('Error '+r.status));return d}
const localConf=$('#conf').onclick;
$('#conf').onclick=async()=>{
 const b=$('#conf');b.disabled=true;b.textContent='Saving…';
 const final=rows.map(r=>({part:r.part.trim(),desc:r.desc.trim(),hsn:r.hsn.trim(),qty:num(r.qty),unit:r.unit.trim(),rate:num(r.rate),amount:+amt(r)}));
 try{
  const d=await api('/api/inward',{method:'POST',body:JSON.stringify({invoiceNo:$('#invno').value,invoiceDate:$('#invdt').value,invoiceTotal:$('#invtot').value,user:'portal user',items:final,extracted:ld('_extracted',[]),image:imgData})});
  $('#donec').innerHTML=`<h2 style="margin-top:0" class="ok">Stock updated</h2><p>Transaction number: <b>${d.no}</b> <span class="mu">(saved to central database)</span></p><div class="tw"><table>${rtable(final)}</table></div><p><button id="nw">Scan another invoice</button></p>`;
  $('#nw').onclick=()=>{rows=[];imgData='';['invno','invdt','invtot'].forEach(x=>$('#'+x).value='');$('#imgc').classList.add('hide');$('#sp').classList.remove('has');$('#ocrmsg').textContent='';renderTable();show('scan')};
  show('done');
 }catch(e){
  localConf();
  $('#donec').insertAdjacentHTML('afterbegin',`<p class="err">Could not reach the central database (${esc(e.message)}). Saved on this device only — it is NOT in the shared stock yet.</p>`);
 }
 b.disabled=false;b.textContent='Confirm & Update Stock'};
renderStock=async function(){
 try{const s=await api('/api/stock');
  $('#st').innerHTML='<thead><tr><th>Part Number</th><th>Description</th><th>HSN</th><th>Qty</th><th>Unit</th><th>Last rate</th></tr></thead><tbody>'+(s.map(r=>`<tr><td>${esc(r.part)}</td><td>${esc(r.description)}</td><td>${esc(r.hsn)}</td><td>${r.qty}</td><td>${esc(r.unit)}</td><td>${r.rate}</td></tr>`).join('')||'<tr><td colspan=6>No stock yet.</td></tr>')+'</tbody>'
 }catch(e){$('#st').innerHTML='<tr><td class="err">Could not load stock: '+esc(e.message)+'</td></tr>'}};
renderHist=async function(){
 try{const t=await api('/api/transactions');
  $('#ht').innerHTML=t.map(x=>`<p><b>${x.no}</b> · Invoice ${esc(x.invoice_no)||'—'} ${esc(x.invoice_date)} · ${x.items} items · ${new Date(x.confirmed_at).toLocaleString()}</p>`).join('')||'No transactions yet.'
 }catch(e){$('#ht').innerHTML='<span class="err">Could not load: '+esc(e.message)+'</span>'}};
rows=[blank()];renderTable();
</script></body></html>
